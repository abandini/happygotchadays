name = "happygotchadays"
main = "src/index.js"
compatibility_date = "2024-10-01"
workers_dev = true

# Binary assets (og-image, favicons, PWA icons) imported as ArrayBuffer modules
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

routes = [
  { pattern = "happygotchadays.com/*", zone_id = "7a2c1c4b70d66e70a4af0cf3578256b3" },
  { pattern = "www.happygotchadays.com/*", zone_id = "7a2c1c4b70d66e70a4af0cf3578256b3" }
]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "gotchadays-db"
database_id = "591d8aa5-4693-4f53-add8-2434a5277972"

# R2 Storage binding for photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gotchadays-photos"

# KV namespace for sessions and caching
[[kv_namespaces]]
binding = "SESSIONS"
id = "5618f8d785c644ae83fe4660fa98c31d"

[[kv_namespaces]]
binding = "CACHE"
id = "10849b13402b40209b5204ec52c7b4c2"

[[kv_namespaces]]
binding = "BEAST_SEO"
id = "36c1eaef07ad4d049b0001a6a353fabc"

# AI binding for Workers AI
[ai]
binding = "AI"

# Secrets (these are set via wrangler secret put)
# JWT_SECRET - for signing JWT tokens
# Run: wrangler secret put JWT_SECRET

# Analytics Engine binding (optional, for tracking metrics)
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Observability
[observability]
enabled = true

# Gotcha day reminder emails. 13:00 UTC is 9am EDT (summer) and 8am EST (winter).
# The 13:30 and 14:00 runs retry stale 'pending' sends (same Idempotency-Key,
# inside Resend's 24h window) and pick up anything over the per-run cap.
# Needs secrets RESEND_API_KEY and JWT_SECRET, and migrations/0002_reminder_sends.sql applied.
[triggers]
crons = ["0 13 * * *", "30 13 * * *", "0 14 * * *"]
